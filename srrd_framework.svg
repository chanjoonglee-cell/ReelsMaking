<svg width="960" height="1180" viewBox="0 0 960 1180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L10,6 L0,12 z" fill="#374151"/>
    </marker>
    <marker id="arrowDashed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L10,6 L0,12 z" fill="#9CA3AF"/>
    </marker>
    <style>
      .title { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size: 13px; fill: #6B7280; }
      .h2 { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size: 17px; font-weight: 700; }
      .h3 { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size: 15px; font-weight: 600; }
      .body { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size: 13px; fill: #1F2937; }
      .small { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size: 11px; fill: #6B7280; }
      .formula { font-family: 'Cambria Math','Times New Roman',serif; font-size: 18px; font-style: italic; font-weight: 600; fill: #111827; }
    </style>
  </defs>

  <!-- Title -->
  <text x="480" y="42" text-anchor="middle" class="title">SRRD 이론적 프레임 — 한 장 정리</text>
  <text x="480" y="65" text-anchor="middle" class="subtitle">자기참조 기반 인출 학습 설계전략 (Self-Referential Retrieval Design)</text>

  <!-- 1. PROBLEM -->
  <rect x="80" y="95" width="800" height="105" fill="#FEF3C7" stroke="#D97706" stroke-width="2" rx="10"/>
  <text x="100" y="123" class="h3" fill="#92400E">① 문제 (Problem)</text>
  <text x="100" y="148" class="body">Bjork (1994) Desirable Difficulty Paradox</text>
  <text x="100" y="170" class="body">— 인출학습은 학습효과를 높이지만, 인지부하가 높아 학습자 이탈을 유발한다.</text>
  <text x="100" y="190" class="body">— 본 연구는 이 패러독스의 <tspan font-weight="700">모바일 자기주도 학습 맥락</tspan> 버전을 다룬다.</text>

  <!-- Arrow 1 -->
  <line x1="480" y1="205" x2="480" y2="240" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. CONSTRUCT + CONCEPT -->
  <rect x="80" y="250" width="800" height="100" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="10"/>
  <text x="100" y="278" class="h3" fill="#1E40AF">② Construct → Focal Concept</text>
  <text x="100" y="305" class="body"><tspan font-weight="700">Construct:</tspan> 모바일 언어학습의 지속성 (Persistence in MALL)</text>
  <text x="100" y="328" class="body"><tspan font-weight="700">Focal Concept:</tspan> SRRD — 학습자 일상 데이터를 자기참조적으로 활용하여 인출학습을 설계하는 전략</text>

  <!-- Arrow 2 -->
  <line x1="480" y1="355" x2="480" y2="395" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- THEORETICAL GENERATOR (left side note) -->
  <rect x="80" y="405" width="220" height="220" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2" rx="10"/>
  <text x="190" y="432" text-anchor="middle" class="h3" fill="#854D0E">💡 이론적 Generator</text>
  <text x="190" y="460" text-anchor="middle" class="body" font-weight="700">Effort-Value Tradeoff</text>
  <text x="190" y="480" text-anchor="middle" class="small">Shenhav et al. (2017)</text>
  <text x="98" y="510" class="small">왜 정확히 세 축인가?</text>
  <text x="98" y="530" class="small">→ 행동 지속은 노력의</text>
  <text x="98" y="548" class="small">  비용·가치·동적 균형의</text>
  <text x="98" y="566" class="small">  함수다.</text>
  <text x="98" y="592" class="small">A·B·C는 이 세 측면을</text>
  <text x="98" y="610" class="small">설계 차원으로 옮긴 것.</text>

  <!-- 3. THREE DESIGN ELEMENTS -->
  <text x="600" y="425" class="h2" fill="#1E40AF">③ SRRD의 세 가지 설계 요소</text>

  <!-- Element A -->
  <rect x="320" y="445" width="180" height="180" fill="#ECFEFF" stroke="#0891B2" stroke-width="2" rx="10"/>
  <text x="410" y="473" text-anchor="middle" class="h3" fill="#155E75">A</text>
  <text x="410" y="495" text-anchor="middle" class="body" font-weight="700">자기참조 콘텐츠</text>
  <line x1="345" y1="505" x2="475" y2="505" stroke="#0891B2" stroke-width="1"/>
  <text x="410" y="525" text-anchor="middle" class="small" fill="#0E7490">의미적 비용 감소</text>
  <text x="410" y="544" text-anchor="middle" class="small" fill="#0E7490">(Cost ↓)</text>
  <text x="330" y="572" class="small">학습 콘텐츠를</text>
  <text x="330" y="588" class="small">학습자 본인의</text>
  <text x="330" y="604" class="small">일상 데이터로 구성</text>
  <text x="330" y="620" class="small" fill="#9CA3AF">Rogers et al. (1977)</text>

  <!-- Element B -->
  <rect x="520" y="445" width="180" height="180" fill="#FCE7F3" stroke="#DB2777" stroke-width="2" rx="10"/>
  <text x="610" y="473" text-anchor="middle" class="h3" fill="#9D174D">B</text>
  <text x="610" y="495" text-anchor="middle" class="body" font-weight="700">즉각 정서 피드백</text>
  <line x1="545" y1="505" x2="675" y2="505" stroke="#DB2777" stroke-width="1"/>
  <text x="610" y="525" text-anchor="middle" class="small" fill="#BE185D">가치 신호 강화</text>
  <text x="610" y="544" text-anchor="middle" class="small" fill="#BE185D">(Value ↑)</text>
  <text x="530" y="572" class="small">인출 직후 정서적·</text>
  <text x="530" y="588" class="small">시각적 보상으로</text>
  <text x="530" y="604" class="small">노력 가치 가시화</text>
  <text x="530" y="620" class="small" fill="#9CA3AF">Operant Conditioning</text>

  <!-- Element C -->
  <rect x="720" y="445" width="180" height="180" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" rx="10"/>
  <text x="810" y="473" text-anchor="middle" class="h3" fill="#14532D">C</text>
  <text x="810" y="495" text-anchor="middle" class="body" font-weight="700">데이터 누적 사이클</text>
  <line x1="745" y1="505" x2="875" y2="505" stroke="#16A34A" stroke-width="1"/>
  <text x="810" y="525" text-anchor="middle" class="small" fill="#15803D">비용-가치 동적 재조정</text>
  <text x="810" y="544" text-anchor="middle" class="small" fill="#15803D">(dC/dt, dV/dt)</text>
  <text x="730" y="572" class="small">학습 결과가 다시</text>
  <text x="730" y="588" class="small">데이터에 누적,</text>
  <text x="730" y="604" class="small">자기관련성 증폭</text>
  <text x="730" y="620" class="small" fill="#9CA3AF">Lally et al. (2010)</text>

  <!-- Generator arrows to A/B/C -->
  <line x1="300" y1="500" x2="320" y2="500" stroke="#CA8A04" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowDashed)"/>
  <line x1="300" y1="525" x2="520" y2="525" stroke="#CA8A04" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowDashed)" opacity="0.5"/>
  <line x1="300" y1="555" x2="720" y2="555" stroke="#CA8A04" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowDashed)" opacity="0.5"/>

  <!-- Combined arrow down -->
  <line x1="410" y1="630" x2="450" y2="675" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="630" x2="480" y2="675" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="630" x2="510" y2="675" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. R(t) FORMULA -->
  <rect x="200" y="685" width="560" height="90" fill="#F3F4F6" stroke="#111827" stroke-width="2" rx="10"/>
  <text x="480" y="715" text-anchor="middle" class="h3">④ 1주차 R(t) 공식이 학술 frame으로 격상</text>
  <text x="480" y="750" text-anchor="middle" class="formula">R(t) = M(t) × A(t) / C(t)</text>
  <text x="480" y="768" text-anchor="middle" class="small">분자(M·A) = 가치 측면 | 분모(C) = 비용 측면 | t에 따른 변화 = 동적 재조정</text>

  <!-- Arrow down -->
  <line x1="480" y1="780" x2="480" y2="815" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. QUALITATIVE SHIFTS -->
  <rect x="80" y="825" width="800" height="130" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" rx="10"/>
  <text x="100" y="853" class="h3" fill="#5B21B6">⑤ 세 매개변수의 시간 단계별 질적 전환</text>

  <text x="115" y="880" class="small" font-weight="700">M(t) 동기:</text>
  <text x="190" y="880" class="small">불안 회피(외적) → 피드백 추동 → 정체성 표현(내적)</text>

  <text x="115" y="903" class="small" font-weight="700">A(t) 성취:</text>
  <text x="190" y="903" class="small">사건적("한 번 해냄") → 진보적("나아지고 있음") → 정체성적("나는 그런 사람")</text>

  <text x="115" y="926" class="small" font-weight="700">C(t) 인지부하:</text>
  <text x="210" y="926" class="small">낯선 노력 → 익숙한 도전 → 가벼운 마찰</text>

  <text x="100" y="948" class="small" fill="#7C3AED" font-style="italic">SRRD가 강할수록 셋이 동조 전환, 약할수록 따로 움직임 (Coordinator 효과)</text>

  <!-- Arrow down -->
  <line x1="480" y1="960" x2="480" y2="995" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. OUTCOMES -->
  <rect x="200" y="1005" width="560" height="100" fill="#D1FAE5" stroke="#059669" stroke-width="2" rx="10"/>
  <text x="480" y="1033" text-anchor="middle" class="h3" fill="#064E3B">⑥ 종속변수 (R(t) ↑)</text>
  <text x="280" y="1063" text-anchor="middle" class="body">📈 D7 / D30 리텐션 ↑</text>
  <text x="480" y="1063" text-anchor="middle" class="body">🔥 연속 학습일(streak) ↑</text>
  <text x="680" y="1063" text-anchor="middle" class="body">🔄 부활율 ↑</text>
  <text x="480" y="1090" text-anchor="middle" class="small" fill="#064E3B">반증조건: SRRD 적용/미적용 사이에 D30 리텐션 기울기 차이가 없으면 명제 폐기</text>

  <!-- Footer -->
  <text x="480" y="1145" text-anchor="middle" class="small" fill="#9CA3AF">© 이찬중 (20253973) | 과학적 사고와 이론화의 기초 | 3주차 과제</text>
</svg>
