<svg width="1400" height="980" viewBox="0 0 1400 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L10,6 L0,12 z" fill="#374151"/>
    </marker>
    <style>
      .title { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size: 32px; font-weight: 800; fill: #111827; }
      .subtitle { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size: 18px; fill: #6B7280; }
      .h2 { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size: 24px; font-weight: 700; }
      .h3 { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size: 20px; font-weight: 700; }
      .body { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size: 17px; fill: #1F2937; }
      .bodyB { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size: 17px; font-weight: 700; fill: #111827; }
      .small { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size: 15px; fill: #374151; }
      .smallB { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size: 15px; font-weight: 700; fill: #1F2937; }
      .micro { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size: 14px; fill: #6B7280; }
    </style>
  </defs>

  <!-- Title -->
  <text x="700" y="48" text-anchor="middle" class="title">SRRD 이론적 프레임 — 한 장 정리</text>
  <text x="700" y="78" text-anchor="middle" class="subtitle">자기참조 기반 인출 학습 설계전략 (Self-Referential Retrieval Design)</text>

  <!-- LEFT COLUMN -->
  <!-- ① Problem -->
  <rect x="30" y="105" width="340" height="270" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5" rx="12"/>
  <text x="50" y="138" class="h3" fill="#92400E">① 문제 (Problem)</text>
  <text x="50" y="172" class="bodyB" fill="#451A03">Bjork (1994)</text>
  <text x="50" y="196" class="bodyB" fill="#451A03">Desirable Difficulty Paradox</text>
  <text x="50" y="228" class="small">• 인출학습 = 학습효과 ↑</text>
  <text x="50" y="252" class="small">• 인출학습 = 인지부하 ↑</text>
  <text x="50" y="274" class="small" fill="#92400E">    → 학습자 이탈</text>
  <line x1="50" y1="292" x2="350" y2="292" stroke="#D97706" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="50" y="318" class="small" font-style="italic" fill="#7C2D12">"어려운 인출학습을 인지부하에도</text>
  <text x="50" y="340" class="small" font-style="italic" fill="#7C2D12">불구하고 지속시키는</text>
  <text x="50" y="362" class="small" font-style="italic" fill="#7C2D12">설계전략은 무엇인가?"</text>

  <!-- ② Construct -->
  <rect x="30" y="390" width="340" height="160" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5" rx="12"/>
  <text x="50" y="423" class="h3" fill="#1E40AF">② Construct</text>
  <text x="50" y="455" class="bodyB" fill="#1E3A8A">모바일 언어학습의 지속성</text>
  <text x="50" y="479" class="small">Persistence in Mobile-Assisted</text>
  <text x="50" y="501" class="small">Language Learning (MALL)</text>
  <text x="50" y="530" class="micro">모바일 환경에서 자기주도적으로</text>
  <text x="50" y="548" class="micro">인출학습을 반복·유지하는 상태</text>

  <!-- Arrow Left → Center -->
  <line x1="375" y1="240" x2="420" y2="240" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="470" x2="420" y2="470" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- CENTER COLUMN -->
  <!-- ③ Focal Concept SRRD -->
  <rect x="425" y="105" width="555" height="155" fill="#E0E7FF" stroke="#4F46E5" stroke-width="3" rx="14"/>
  <text x="702" y="140" text-anchor="middle" class="h2" fill="#3730A3">③ ★ SRRD ★</text>
  <text x="702" y="170" text-anchor="middle" class="bodyB" fill="#3730A3">자기참조 기반 인출 학습 설계전략</text>
  <text x="702" y="194" text-anchor="middle" class="small" fill="#4F46E5">Self-Referential Retrieval Design</text>
  <line x1="475" y1="210" x2="930" y2="210" stroke="#4F46E5" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="702" y="234" text-anchor="middle" class="small" fill="#1E1B4B">학습자 일상 데이터를 자기참조적으로 활용한</text>
  <text x="702" y="254" text-anchor="middle" class="small" fill="#1E1B4B">인출학습의 학습경험 설계전략</text>

  <!-- Arrow down to A/B/C -->
  <line x1="702" y1="270" x2="702" y2="305" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Element A -->
  <rect x="430" y="315" width="170" height="225" fill="#ECFEFF" stroke="#0891B2" stroke-width="2.5" rx="12"/>
  <text x="515" y="350" text-anchor="middle" class="h2" fill="#155E75">A</text>
  <text x="515" y="380" text-anchor="middle" class="bodyB" fill="#155E75">자기참조</text>
  <text x="515" y="400" text-anchor="middle" class="bodyB" fill="#155E75">콘텐츠 구성</text>
  <line x1="450" y1="415" x2="580" y2="415" stroke="#0891B2" stroke-width="1"/>
  <text x="450" y="442" class="small">콘텐츠를 학습자</text>
  <text x="450" y="462" class="small">본인의 일상</text>
  <text x="450" y="482" class="small">데이터로 생성</text>
  <text x="450" y="514" class="micro" font-style="italic" fill="#9CA3AF">A만 →</text>
  <text x="450" y="532" class="micro" fill="#9CA3AF">단발성 자기관련</text>

  <!-- Element B -->
  <rect x="617" y="315" width="170" height="225" fill="#FCE7F3" stroke="#DB2777" stroke-width="2.5" rx="12"/>
  <text x="702" y="350" text-anchor="middle" class="h2" fill="#9D174D">B</text>
  <text x="702" y="380" text-anchor="middle" class="bodyB" fill="#9D174D">즉각 피드백</text>
  <text x="702" y="400" text-anchor="middle" class="bodyB" fill="#9D174D">&amp; 보상</text>
  <line x1="637" y1="415" x2="767" y2="415" stroke="#DB2777" stroke-width="1"/>
  <text x="637" y="442" class="small">인출 직후 정서·</text>
  <text x="637" y="462" class="small">시각적 보상</text>
  <text x="637" y="482" class="small">제공</text>
  <text x="637" y="514" class="micro" font-style="italic" fill="#9CA3AF">B만 →</text>
  <text x="637" y="532" class="micro" fill="#9CA3AF">일반 게이미피케이션</text>

  <!-- Element C -->
  <rect x="804" y="315" width="170" height="225" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5" rx="12"/>
  <text x="889" y="350" text-anchor="middle" class="h2" fill="#14532D">C</text>
  <text x="889" y="380" text-anchor="middle" class="bodyB" fill="#14532D">데이터 누적</text>
  <text x="889" y="400" text-anchor="middle" class="bodyB" fill="#14532D">사이클</text>
  <line x1="824" y1="415" x2="954" y2="415" stroke="#16A34A" stroke-width="1"/>
  <text x="824" y="442" class="small">결과가 데이터에</text>
  <text x="824" y="462" class="small">누적, 자기관련성</text>
  <text x="824" y="482" class="small">증폭</text>
  <text x="824" y="514" class="micro" font-style="italic" fill="#9CA3AF">C만 →</text>
  <text x="824" y="532" class="micro" fill="#9CA3AF">의미 없는 축적</text>

  <!-- Combination emphasis -->
  <rect x="425" y="560" width="555" height="70" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6,3" rx="10"/>
  <text x="702" y="592" text-anchor="middle" class="bodyB" fill="#92400E">⚡ SRRD = A · B · C 세 요소의 결합 자체</text>
  <text x="702" y="617" text-anchor="middle" class="small" fill="#92400E">하나만 작동하면 SRRD가 성립하지 않음</text>

  <!-- Arrow Center → Right -->
  <line x1="985" y1="180" x2="1030" y2="180" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="985" y1="450" x2="1030" y2="450" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- RIGHT COLUMN -->
  <!-- ④ Variables -->
  <rect x="1035" y="105" width="335" height="220" fill="#F3F4F6" stroke="#374151" stroke-width="2.5" rx="12"/>
  <text x="1055" y="138" class="h3" fill="#111827">④ Variables</text>
  <text x="1055" y="170" class="smallB">독립변수 (IV)</text>
  <text x="1055" y="194" class="micro">A·B·C 충족 여부 및 강도의</text>
  <text x="1055" y="212" class="micro">composite index</text>
  <text x="1055" y="242" class="smallB">종속변수 1 — 리텐션</text>
  <text x="1055" y="266" class="micro">D1 / D7 / D21 / D66 활성 비율</text>
  <text x="1055" y="295" class="smallB">종속변수 2 — 학습완주율</text>
  <text x="1055" y="319" class="micro">학습을 포기하지 않은 비율</text>

  <!-- ⑤ Tentative Proposition -->
  <rect x="1035" y="340" width="335" height="145" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5" rx="12"/>
  <text x="1055" y="373" class="h3" fill="#1E40AF">⑤ Proposition</text>
  <text x="1055" y="405" class="small" fill="#1E3A8A">SRRD 적용 환경은 미적용 환경</text>
  <text x="1055" y="427" class="small" fill="#1E3A8A">대비 리텐션과 학습완주율을</text>
  <text x="1055" y="449" class="small" fill="#1E3A8A">유의미하게 증가시킨다.</text>
  <text x="1055" y="475" class="micro" font-style="italic" fill="#4F46E5">R(t) = M(t) × A(t) / C(t)</text>

  <!-- ⑦ Falsification -->
  <rect x="1035" y="500" width="335" height="135" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5" rx="12"/>
  <text x="1055" y="533" class="h3" fill="#991B1B">⑦ 반증 조건</text>
  <text x="1055" y="565" class="small" fill="#7F1D1D">SRRD 적용/미적용 사이</text>
  <text x="1055" y="587" class="small" fill="#7F1D1D">D30 재방문율·학습완주율에</text>
  <text x="1055" y="609" class="small" fill="#7F1D1D">차이가 없으면</text>
  <text x="1055" y="630" class="smallB" fill="#991B1B">본 명제는 폐기된다.</text>

  <!-- ⑥ Existing Theories (Bottom row) -->
  <rect x="30" y="675" width="1340" height="245" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2.5" rx="12"/>
  <text x="55" y="708" class="h3" fill="#5B21B6">⑥ 기존 이론과의 차별점 및 관계성</text>

  <!-- Theory 1 -->
  <rect x="55" y="725" width="425" height="180" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.5" rx="8"/>
  <text x="75" y="754" class="smallB" fill="#5B21B6">Bjork (1994)</text>
  <text x="75" y="774" class="smallB" fill="#5B21B6">Desirable Difficulty</text>
  <line x1="75" y1="785" x2="465" y2="785" stroke="#E5E7EB" stroke-width="1"/>
  <text x="75" y="810" class="micro" font-weight="700">기존:</text>
  <text x="120" y="810" class="micro">패러독스 자체 제시</text>
  <text x="75" y="830" class="micro" fill="#9CA3AF">  (실험실·교실 맥락)</text>
  <text x="75" y="862" class="micro" font-weight="700" fill="#5B21B6">본 연구:</text>
  <text x="130" y="862" class="micro" fill="#1F2937">모바일 자기주도 맥락의</text>
  <text x="130" y="882" class="micro" fill="#1F2937">설계전략 제안</text>

  <!-- Theory 2 -->
  <rect x="497" y="725" width="425" height="180" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.5" rx="8"/>
  <text x="517" y="754" class="smallB" fill="#5B21B6">Rogers et al. (1977)</text>
  <text x="517" y="774" class="smallB" fill="#5B21B6">Self-Reference Effect</text>
  <line x1="517" y1="785" x2="907" y2="785" stroke="#E5E7EB" stroke-width="1"/>
  <text x="517" y="810" class="micro" font-weight="700">기존:</text>
  <text x="562" y="810" class="micro">단기 기억 향상 영역</text>
  <text x="517" y="862" class="micro" font-weight="700" fill="#5B21B6">본 연구:</text>
  <text x="572" y="862" class="micro" fill="#1F2937">지속 행동까지 확장</text>

  <!-- Theory 3 -->
  <rect x="939" y="725" width="425" height="180" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.5" rx="8"/>
  <text x="959" y="754" class="smallB" fill="#5B21B6">Roediger &amp; Karpicke (2006)</text>
  <text x="959" y="774" class="smallB" fill="#5B21B6">Testing Effect</text>
  <line x1="959" y1="785" x2="1349" y2="785" stroke="#E5E7EB" stroke-width="1"/>
  <text x="959" y="810" class="micro" font-weight="700">기존:</text>
  <text x="1004" y="810" class="micro">단발 학습 성과</text>
  <text x="959" y="862" class="micro" font-weight="700" fill="#5B21B6">본 연구:</text>
  <text x="1014" y="862" class="micro" fill="#1F2937">반복 인출의 지속 조건을</text>
  <text x="1014" y="882" class="micro" fill="#1F2937">설계 차원에서 다룸</text>

  <!-- Footer -->
  <text x="700" y="955" text-anchor="middle" class="micro" fill="#9CA3AF">과학적 사고와 이론화의 기초 | 3주차 과제 — 개념화 (Construct → Concept → Variable)</text>
</svg>
